services:
  backend:
    # Test branch: build the backend from this repo so API/migration changes are used.
    # Main keeps the upstream prebuilt image for the stable Dokploy deploy.
    image: beepub-backend:ross-sync-notes-stamp
    build: ./backend
    pull_policy: build
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

    volumes:
      - app_data:/data/app
      - ${BEEPUB_BOOKS_PATH:?Set BEEPUB_BOOKS_PATH}:/data/books
      - ${BEEPUB_COVERS_PATH:?Set BEEPUB_COVERS_PATH}:/data/covers
      - ${BEEPUB_ILLUSTRATIONS_PATH:?Set BEEPUB_ILLUSTRATIONS_PATH}:/data/illustrations

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  worker:
    image: beepub-backend:ross-sync-notes-stamp
    build: ./backend
    pull_policy: build
    restart: unless-stopped
    mem_limit: 4g

    command: ["bash", "start-worker.sh"]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}

    volumes:
      - app_data:/data/app
      - ${BEEPUB_BOOKS_PATH:?Set BEEPUB_BOOKS_PATH}:/data/books
      - ${BEEPUB_COVERS_PATH:?Set BEEPUB_COVERS_PATH}:/data/covers
      - ${BEEPUB_ILLUSTRATIONS_PATH:?Set BEEPUB_ILLUSTRATIONS_PATH}:/data/illustrations

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  beat:
    image: beepub-backend:ross-sync-notes-stamp
    build: ./backend
    pull_policy: build
    restart: unless-stopped

    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.celeryapp:celery",
        "beat",
        "--loglevel=info"
      ]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}

    volumes:
      - app_data:/data/app

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  migrate:
    image: beepub-backend:ross-sync-notes-stamp
    build: ./backend
    pull_policy: build
    restart: "no"

    command: ["sh", "migrate.sh"]

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-beepub}:${POSTGRES_PASSWORD:-beepub}@postgres/${POSTGRES_DB:-beepub}
      SECRET_KEY: ${SECRET_KEY:-}

    volumes:
      - app_data:/data/app

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    # Test branch: build the frontend from this repo so reader changes are used.
    # Main keeps the upstream prebuilt image for the stable Dokploy deploy.
    image: beepub-frontend:ross-cfi-test
    build: ./frontend
    pull_policy: build
    restart: unless-stopped

    environment:
      ORIGIN: ${BEEPUB_ORIGIN}
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend


  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beepub}
      POSTGRES_USER: ${POSTGRES_USER:-beepub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beepub}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beepub}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  nginx:
    image: ghcr.io/oalieno/beepub-nginx:${BEEPUB_VERSION:-0.13.0}
    pull_policy: missing
    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - ${BEEPUB_COVERS_PATH:?Set BEEPUB_COVERS_PATH}:/data/covers:ro

    depends_on:
      - backend
      - frontend


volumes:
  postgres_data:
  redis_data:
  app_data: